<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Video</title>
  <style>
    :root {
      --bg-primary: radial-gradient(circle at 50% 0%,
          rgba(120, 120, 160, 0.08) 0%,
          rgba(11, 11, 15, 0) 70%),
        #0b0b0f;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-shadow: 0 60px 120px -40px rgba(0, 0, 0, 0.9);
      --text-primary: rgba(255, 255, 255, 0.92);
      --text-secondary: rgba(255, 255, 255, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100dvh;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, BlinkMacSystemFont,
        Inter, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      display: flex;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 12px 16px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text-primary);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 180ms ease, transform 180ms ease;
      user-select: none;
    }

    .pill:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
    }

    .pill .icon {
      font-size: 18px;
      line-height: 1;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 24px;
      width: 100%;
    }

    .card {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(0.375rem, 1vw, 0.5rem);
      border-radius: clamp(1rem, 2vw, 1.25rem);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      box-shadow: var(--card-shadow);
      transition: transform 220ms ease, box-shadow 220ms ease;
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 70px 140px -40px rgba(0, 0, 0, 0.95);
    }

    .video {
      display: block;
      height: min(85dvh, 800px);
      width: auto;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      border-radius: clamp(0.75rem, 1.5vw, 1rem);
      background: #050508;
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      border-radius: clamp(0.75rem, 1.5vw, 1rem);
    }

    .play-overlay::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      border-radius: inherit;
      transition: background 200ms ease;
    }

    .play-overlay:hover::before {
      background: rgba(0, 0, 0, 0.5);
    }

    .play-btn {
      position: relative;
      width: 88px;
      height: 88px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      border: 2px solid rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 200ms ease, background 200ms ease;
    }

    .play-overlay:hover .play-btn {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.25);
    }

    .play-btn::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 16px 0 16px 28px;
      border-color: transparent transparent transparent #fff;
      margin-left: 6px;
    }

    .footer {
      text-align: center;
      font-size: clamp(0.75rem, 1.5vw, 0.875rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-secondary);
      user-select: none;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <div class="pill" onclick="document.querySelector('.card').scrollIntoView({behavior:'smooth'})">
      <span class="icon">🏠</span>
      <span>Accueil</span>
    </div>
    <div class="pill" onclick="location.href='fromage.html'">
      <span class="icon">🧀</span>
      <span>Fromage</span>
    </div>
  </div>
  <main class="container">
    <div class="card">
      <video class="video" src="video.mp4" loop playsinline controls preload="metadata" oncontextmenu="return false" draggable="false" style="-webkit-user-select:none;user-select:none;"></video>
      <div class="play-overlay" id="playOverlay">
        <div class="play-btn"></div>
      </div>
    </div>

  </main>
  <script>
    document.addEventListener("contextmenu", e => e.preventDefault());
    const overlay = document.getElementById("playOverlay");
    const video = document.querySelector(".video");
    overlay.addEventListener("click", () => {
      video.play();
      overlay.style.display = "none";
    });
  </script>
</body>

</html>
